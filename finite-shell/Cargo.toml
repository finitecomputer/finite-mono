[package]
name = "finite-shell"
# The crate version IS the shell version advertised as SHELL_VERSION and
# compared against payload manifests' min_shell_version.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "finite_shell"
path = "src/lib.rs"

[[bin]]
name = "finite-shell"
path = "src/main.rs"

[dependencies]
bech32.workspace = true
clap.workspace = true
finite-release.workspace = true
finite-service-directory.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "sync"] }

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
tempfile.workspace = true

[lints]
workspace = true
