[package]
name = "finitesitesd"
version = "0.2.16"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
url = "2"
# Audited against workspace MSRV; omit SSO and multi-region SigV4a.
aws-config = { version = "=1.8.11", default-features = false, features = ["rt-tokio", "credentials-process"] }
aws-sdk-s3 = { version = "=1.115.0", default-features = false, features = ["rt-tokio"] }
# Match the workspace's ring TLS provider; avoid a second native crypto build.
aws-smithy-http-client = { version = "=1.1.9", default-features = false, features = ["rustls-ring"] }
finite-mail = { workspace = true }
finitesites-proto = { path = "../finitesites-proto" }
finitesites-blob = { path = "../finitesites-blob" }
finitesites-store = { path = "../finitesites-store" }
finitesites-engine = { path = "../finitesites-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
ureq = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
pulldown-cmark = { workspace = true }
tempfile = { workspace = true }
libc = "0.2"
