# The single Rust pin for this repository.
#
# Every consumer reads this file; do not add a second version string
# anywhere else (CI workflows, flake.nix, scripts, docs):
#   - rustup on a dev host honors it automatically inside the checkout.
#   - dtolnay/rust-toolchain in CI reads it when no `toolchain:` input is set.
#   - flake.nix builds via oxalica's `fromRustupToolchainFile`, so Nix dev
#     shells, CI nix shells, and deploy images all build with this toolchain.
# Upgrade by editing this file in one reviewed PR. Platform-specific std
# targets (the Darwin iOS targets) stay in flake.nix, which adds them
# conditionally on top of this file.
[toolchain]
channel = "1.93.1"
profile = "minimal"
components = ["clippy", "rust-analyzer", "rust-src", "rustfmt"]
