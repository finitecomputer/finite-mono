[package]
name = "finite-mover"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "The mover of finite.computer agents to finite.chat (FIN-463), run on lat-2."

[dependencies]
crc32fast = "1.5"
finite-mover-host = { path = "../finite-mover-host" }
finite-nostr.workspace = true
hex.workspace = true
# The mover key's npub (`finite-mover npub`).
nostr.workspace = true
reqwest.workspace = true
# finite-brain's database, opened read-only by `finite-mover-brains` (FIN-499).
rusqlite.workspace = true
# Stops a stuck child's whole process group (src/child.rs).
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Core's database, read through the mover's read-only role (M1); the
# versions Core uses.
tokio = { workspace = true, features = ["rt"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
zeroize.workspace = true

[dev-dependencies]
# finite-brain's own schema, for the owned brains reader's tests.
finite-brain-store.workspace = true
# Core's own schema, for the fleet's database tests.
finite-saas-core = { path = "../finite-saas-core" }
tempfile.workspace = true
# Reads stages back in the fake finite.chat test.
zip.workspace = true

[lints]
workspace = true
