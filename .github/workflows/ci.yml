name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - migration-integration

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: finite

jobs:
  changes:
    name: Detect required CI harnesses
    runs-on: depot-ubuntu-24.04
    outputs:
      run_rust: ${{ steps.detect.outputs.run_rust }}
      run_dashboard: ${{ steps.detect.outputs.run_dashboard }}
      run_electron_alpha: ${{ steps.detect.outputs.run_electron_alpha }}
      run_hermes_bridge: ${{ steps.detect.outputs.run_hermes_bridge }}
      run_nix_checks: ${{ steps.detect.outputs.run_nix_checks }}
      run_nix_service_packages: ${{ steps.detect.outputs.run_nix_service_packages }}
      run_devfinity_smoke: ${{ steps.detect.outputs.run_devfinity_smoke }}
      run_brain_product_matrix: ${{ steps.detect.outputs.run_brain_product_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect required harnesses
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          run_rust=false
          run_dashboard=false
          run_electron_alpha=false
          run_hermes_bridge=false
          run_nix_checks=false
          run_nix_service_packages=false
          run_devfinity_smoke=false
          run_brain_product_matrix=false

          select_all() {
            run_rust=true
            run_dashboard=true
            # Electron CI remains disabled until we actually build and ship an
            # Electron surface again; the current alpha artifact is unused.
            # Re-enable this when Electron becomes an active product target.
            run_electron_alpha=false
            run_hermes_bridge=true
            run_nix_checks=true
            run_nix_service_packages=true
            run_devfinity_smoke=true
            run_brain_product_matrix=true
          }

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              diff_range="$PR_BASE_SHA...$PR_HEAD_SHA"
              ;;
            push)
              diff_range="$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA"
              ;;
            merge_group)
              # Merge queue validation must report every required check on the
              # synthetic merge group SHA.
              select_all
              diff_range=
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ -n "$diff_range" ]]; then
            changed_files="$RUNNER_TEMP/ci-changed-files"
            # Surface both sides of a rename so the old path still selects its harness.
            git diff --name-only --no-renames "$diff_range" -- > "$changed_files"

            while IFS= read -r path; do
              case "$path" in
                docs/*|README.md|CONTRIBUTING.md|AGENTS.md|CONTEXT-MAP.md)
                  ;;
                finitecomputer-v2/apps/dashboard/*|finitechat/packages/finitechat-chat-ui/*)
                  run_dashboard=true
                  run_nix_checks=true
                  run_devfinity_smoke=true
                  ;;
                *)
                  select_all
                  break
                  ;;
              esac
            done < "$changed_files"
          fi

          {
            echo "run_rust=$run_rust"
            echo "run_dashboard=$run_dashboard"
            echo "run_electron_alpha=$run_electron_alpha"
            echo "run_hermes_bridge=$run_hermes_bridge"
            echo "run_nix_checks=$run_nix_checks"
            echo "run_nix_service_packages=$run_nix_service_packages"
            echo "run_devfinity_smoke=$run_devfinity_smoke"
            echo "run_brain_product_matrix=$run_brain_product_matrix"
          } >> "$GITHUB_OUTPUT"

  rust:
    name: Rust workspace
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: true
          use-flakehub: false

      - name: Install Rust
        # Pinned to 1.93.1: 1.88's clippy trips uninlined_format_args on v2
        # crates, and floating stable (1.96 today) trips new let-chain lints
        # in devfinity. 1.93.1 is verified clean across the whole workspace.
        # Bump deliberately (run clippy locally first), don't float.
        # MSRV (rust-version 1.88) is still exercised by the release builds.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: nix develop .#rust-ci --command just test

  dashboard:
    name: Dashboard
    needs: changes
    if: needs.changes.outputs.run_dashboard == 'true'
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        working-directory: finitecomputer-v2/apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: finitecomputer-v2/apps/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint dashboard
        run: pnpm run lint

      - name: Typecheck dashboard and TSX tooling
        # `next build` checks only the application graph. This project-wide
        # tsc invocation also covers scripts/ and browser/ files run by tsx.
        run: pnpm run typecheck

      - name: Test dashboard
        run: pnpm test

      - name: Test dashboard product flows
        run: pnpm run test:browser

      - name: Build dashboard
        run: pnpm run build

  electron-alpha:
    name: Electron production-dashboard alpha
    needs: changes
    if: needs.changes.outputs.run_electron_alpha == 'true'
    # This job builds and tests its own Rust daemon on macOS, so it consumes
    # no artifacts from the Rust workspace or Dashboard jobs.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: Swatinem/rust-cache@v2

      - name: Device parity and Electron boundary gates
        run: nix develop --command just chat-device-parity

      - name: Build ad-hoc-signed internal alpha
        run: nix develop --command just chat-electron-package

      - name: Inspect packaged daemon and production-dashboard boundary
        run: |
          app="finitechat/apps/electron-chat/release/Finite Chat.app"
          test -x "$app/Contents/Resources/finitechatd"
          test -f "$app/Contents/Resources/app/electron/main.cjs"
          test -f "$app/Contents/Resources/app/electron/preload.cjs"
          test ! -e "$app/Contents/Resources/app/dist"
          grep -n 'https://finite\.computer' "$app/Contents/Resources/app/electron/main.cjs"
          ! grep -R -n -E 'spawn\("cargo"|cargo run' "$app/Contents/Resources/app/electron"
          ! otool -L "$app/Contents/Resources/finitechatd" | grep -F '/nix/store/'
          "$app/Contents/Resources/finitechatd" --help >/dev/null
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Archive internal alpha
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "finitechat/apps/electron-chat/release/Finite Chat.app" \
            finitechat/apps/electron-chat/release/finite-chat-electron-alpha.zip

      - name: Publish internal alpha
        uses: actions/upload-artifact@v4
        with:
          name: finite-chat-electron-alpha-macos-${{ runner.arch }}
          path: finitechat/apps/electron-chat/release/finite-chat-electron-alpha.zip
          if-no-files-found: error

  hermes-bridge:
    name: finitechat Hermes bridge
    needs: changes
    if: needs.changes.outputs.run_hermes_bridge == 'true'
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        working-directory: finitechat
    env:
      FINITE_HERMES_AGENT_VERSION: "0.20.0"
      # PyPI channel was retired upstream in v0.20.0; install from the pinned
      # source tarball instead (same dist as the runtime image build).
      FINITE_HERMES_AGENT_DIST_URL: "https://github.com/NousResearch/hermes-agent/archive/refs/tags/v2026.8.3.tar.gz"
      FINITE_HERMES_AGENT_DIST_SHA256: "370542c7219faba6300905c3b419e14e6508a31ac698a1a5174e0386990834be"
      # The hermes scripts resolve reports and built binaries relative to the
      # finitechat/ working directory (target/...); point cargo there too so
      # the two agree, exactly like the pre-mono repo layout.
      CARGO_TARGET_DIR: ${{ github.workspace }}/finitechat/target
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Hermes sidecar smoke
        run: scripts/hermes-sidecar-smoke.sh

      - name: Install Python tooling
        run: |
          curl -fsSLo /tmp/hermes-agent.tar.gz "$FINITE_HERMES_AGENT_DIST_URL"
          echo "$FINITE_HERMES_AGENT_DIST_SHA256  /tmp/hermes-agent.tar.gz" | sha256sum --check -
          HERMES_NIX_BUILD=1 python3 -m pip install basedpyright==1.39.8 "hermes-agent @ file:///tmp/hermes-agent.tar.gz" ruff==0.15.17

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff check
        run: ruff check .

      - name: BasedPyright
        run: basedpyright

      - name: Hermes adapter regression report
        run: scripts/hermes-adapter-regression-report.py --report "$CARGO_TARGET_DIR/hermes-adapter-regressions/report.json"

      - name: Hermes platform adapter tests
        run: python3 -m unittest discover -s tests -p '*test*.py'

  nix-checks:
    name: Skills + search static checks (nix shell)
    needs: changes
    if: needs.changes.outputs.run_nix_checks == 'true'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Skills check
        run: nix develop --command just skills check
      - name: Brain product language check
        run: nix develop --command just brain-language-check
      - name: Search check
        run: nix develop --command just search check
      - name: Canonical Runtime image contract
        run: nix develop --command just runtime-image-contract
      - name: Finite Private DeepSeek production candidate contract
        run: nix develop --command just finite-private-deepseek-contract
      - name: lat1 existing-Runtime rollout contract
        run: nix develop --command just lat1-rollout-contract
      - name: lat1 healthcheck activation contract
        run: nix develop --command just lat1-healthcheck-contract
      - name: Self-hosted monitoring contract
        run: nix develop --command just self-hosted-monitoring-contract
      - name: Kata Runner host anti-drift contract
        run: nix develop --command just runner-host-contract
      - name: Canonical read-only platform status contract
        run: nix develop --command just finite-status-contract
      - name: Identity edge route contract
        run: nix develop --command just identity-edge-contract
      - name: Stripe Price contract
        run: nix develop --command just stripe-price-contract
      - name: Hosted Recovery Set contract
        run: nix develop --command just hosted-recovery-contract
      - name: Litestream recovery contract
        run: nix develop --command just litestream-recovery-contract
      - name: lat1 secret bootstrap contract
        run: nix develop --command just lat1-secret-bootstrap-contract
      - name: lat2 runner guardrails contract
        run: nix develop --command just lat2-runner-guardrails-contract
      - name: Evaluate production NixOS configuration
        run: nix eval .#nixosConfigurations.finite-lat-1.config.system.build.toplevel.drvPath

  nix-service-packages:
    name: Nix service packages
    needs: changes
    if: needs.changes.outputs.run_nix_service_packages == 'true'
    runs-on: [self-hosted, Linux, X64, finite-lat-2, docker]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Other containerized self-hosted jobs can preserve root-owned
          # diagnostics. A fresh path keeps their artifacts from poisoning
          # this clean package-build checkout.
          path: nix-packages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Select Cachix push mode
        id: cachix
        env:
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          push_enabled=false
          case "$GITHUB_EVENT_NAME" in
            push|merge_group)
              push_enabled=true
              ;;
            pull_request)
              if [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
                push_enabled=true
              fi
              ;;
          esac

          echo "push_enabled=$push_enabled" >> "$GITHUB_OUTPUT"
      - name: Configure Cachix read-only cache
        if: steps.cachix.outputs.push_enabled != 'true'
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true
      - name: Require Cachix token for trusted cache push
        if: steps.cachix.outputs.push_enabled == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo "::error::set CACHIX_AUTH_TOKEN as a repository or organization Actions secret"
            exit 1
          fi
      - name: Configure Cachix trusted cache
        if: steps.cachix.outputs.push_enabled == 'true'
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build every scoped Rust package
        id: build_packages
        working-directory: nix-packages-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          BUILD_PLAN: ${{ runner.temp }}/nix-service-package-build-plan
          PACKAGE_OUTPUTS: ${{ runner.temp }}/nix-service-package-outputs
        run: |
          set -euo pipefail

          packages=(
            ".#packages.x86_64-linux.finite-saas-core"
            ".#packages.x86_64-linux.finite-saas-runner"
            ".#packages.x86_64-linux.finitechat-server"
            ".#packages.x86_64-linux.finitechat-hosted-device"
            ".#packages.x86_64-linux.finite-agentd"
            ".#packages.x86_64-linux.finite-specialization-worker"
            ".#packages.x86_64-linux.finitesitesd"
            ".#packages.x86_64-linux.finite-brain"
            ".#packages.x86_64-linux.finite-identity"
            ".#packages.x86_64-linux.fsite"
            ".#packages.x86_64-linux.fbrain"
            ".#packages.x86_64-linux.finitechat"
          )

          nix build --dry-run --option builders '' "${packages[@]}" 2>&1 | tee "$BUILD_PLAN"
          if grep -Eq 'derivations? will be built:' "$BUILD_PLAN"; then
            echo "built_paths=true" >> "$GITHUB_OUTPUT"
          else
            echo "built_paths=false" >> "$GITHUB_OUTPUT"
          fi

          nix build --no-link --print-build-logs --print-out-paths --option builders '' "${packages[@]}" \
            | tee "$PACKAGE_OUTPUTS"
      - name: Push Nix service package runtime closures
        if: steps.cachix.outputs.push_enabled == 'true' && steps.build_packages.outputs.built_paths == 'true'
        working-directory: nix-packages-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          PACKAGE_OUTPUTS: ${{ runner.temp }}/nix-service-package-outputs
        run: |
          set -euo pipefail

          if [[ ! -s "$PACKAGE_OUTPUTS" ]]; then
            echo "::error::Nix service package build did not record any output paths"
            exit 1
          fi

          closure_paths="$RUNNER_TEMP/nix-service-package-runtime-closure"
          mapfile -t outputs < "$PACKAGE_OUTPUTS"
          nix path-info --recursive "${outputs[@]}" > "$closure_paths"
          closure_count="$(wc -l < "$closure_paths" | tr -d '[:space:]')"
          echo "Pushing $closure_count Nix runtime closure paths to $CACHIX_CACHE_NAME"
          xargs -r -d '\n' cachix push "$CACHIX_CACHE_NAME" < "$closure_paths"
      - name: Skip Cachix push for fully substituted service packages
        if: steps.cachix.outputs.push_enabled == 'true' && steps.build_packages.outputs.built_paths != 'true'
        run: echo "Nix dry-run found no service package derivations to build; skipping Cachix push."
      - name: Verify Chat reports its scoped source fingerprint
        working-directory: nix-packages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          chat_out="$(
            nix build --no-link --print-out-paths --option builders '' \
              .#packages.x86_64-linux.finitechat-server
          )"
          expected="$(
            nix eval --raw \
              .#packages.x86_64-linux.finitechat-server.sourceFingerprint
          )"
          port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          health_json="$(mktemp)"
          "$chat_out/bin/finitechat-server" serve "127.0.0.1:$port" &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f "$health_json"' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:$port/health" >"$health_json"; then
              break
            fi
            sleep 1
          done
          python3 - "$health_json" "$expected" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              health = json.load(stream)
          assert health["source_fingerprint"] == sys.argv[2], health
          assert health["source_dirty"] is False, health
          assert "source_commit" not in health, health
          PY
      - name: Remove Nix package checkout
        if: always()
        env:
          CHECKOUT_PATH: ${{ github.workspace }}/nix-packages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/nix-packages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$CHECKOUT_PATH" != "$expected" || "$CHECKOUT_PATH" == "$GITHUB_WORKSPACE" ]]; then
            printf 'refusing unexpected checkout cleanup target: %s\n' "$CHECKOUT_PATH" >&2
            exit 64
          fi
          if [[ -e "$CHECKOUT_PATH" ]]; then
            sudo -n find "$CHECKOUT_PATH" -xdev -depth -delete
          fi

  devfinity-smoke:
    name: devfinity services-only smoke
    needs: changes
    if: needs.changes.outputs.run_devfinity_smoke == 'true'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: true
          use-flakehub: false
      - uses: Swatinem/rust-cache@v2
      - name: Prebuild stack and smoke artifacts
        # devfinity's readiness window is shorter than a cold compile of the
        # whole stack on a hosted runner; build first so the preflight is a
        # no-op and the wait measures actual service startup. One build per
        # package: combined -p builds unify features (resolver 2) and produce
        # artifacts the per-package `cargo run` invocations don't reuse.
        # The smoke script also shells out to fsite and two focused cargo test
        # commands after services are live, so precompile those artifacts here
        # instead of spending that time inside the smoke window.
        run: |
          nix develop .#devfinity-ci --command bash -euxo pipefail -c '
            cargo build --locked -p devfinity
            cargo build --locked -p finite-saas-core
            cargo build --locked -p finitechat-server
            cargo build --locked -p finitechat-hosted-device
            cargo build --locked -p finitesitesd
            cargo build --locked -p finite-identity --bin finite-identityd
            cargo build --locked -p finite-brain-app
            cargo build --locked -p fsite-cli
            cargo test -p finitechat-client --locked --lib --no-run
            cargo test -p devfinity --locked --test stack_smoke --no-run
          '
      - name: devfinity smoke
        env:
          # Cold-cache runs (e.g. when the Actions cache service hiccups)
          # compile the stack inside the readiness window; give CI headroom.
          DEVFINITY_READY_TIMEOUT_SECS: "600"
        run: nix develop .#devfinity-ci --command just dev smoke
      - name: Dump devfinity logs on failure
        if: failure()
        run: |
          for f in .local-state/dfs/runs/default/logs/*; do
            echo "===== $f ====="
            tail -50 "$f" || true
          done

  brain-product-matrix:
    name: Brain full-product matrix
    needs: changes
    if: needs.changes.outputs.run_brain_product_matrix == 'true'
    runs-on: [self-hosted, Linux, X64, finite-lat-2, docker]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Containerized failures preserve root-owned diagnostics. Use a fresh
          # checkout per attempt so those artifacts cannot poison checkout.
          path: brain-matrix-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Real Hermes, managed skill, Runtime, fbrain, signed Brain, Hosted Device, and Product Client
        working-directory: brain-matrix-${{ github.run_id }}-${{ github.run_attempt }}
        run: nix develop --command just brain-product-matrix
      - name: Remove canceled matrix runtime
        if: always()
        working-directory: brain-matrix-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          state_prefix="$PWD/.local-state/brain-product-matrix-"
          docker ps -aq \
            --filter label=computer.finite.v2.runtime=true \
            --filter label=computer.finite.v2.source_host_id=devfinity-docker |
          while read -r container; do
            while read -r source; do
              case "$source" in
                "$state_prefix"*) docker rm -f "$container"; break ;;
              esac
            done < <(docker inspect --format '{{range .Mounts}}{{println .Source}}{{end}}' "$container")
          done
      - name: Upload boundary report and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-product-matrix
          path: brain-matrix-${{ github.run_id }}-${{ github.run_attempt }}/target/brain-product-matrix
          if-no-files-found: error
      - name: Remove Brain matrix checkout
        if: always()
        env:
          CHECKOUT_PATH: ${{ github.workspace }}/brain-matrix-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/brain-matrix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$CHECKOUT_PATH" != "$expected" || "$CHECKOUT_PATH" == "$GITHUB_WORKSPACE" ]]; then
            printf 'refusing unexpected checkout cleanup target: %s\n' "$CHECKOUT_PATH" >&2
            exit 64
          fi
          if [[ -e "$CHECKOUT_PATH" ]]; then
            sudo -n find "$CHECKOUT_PATH" -xdev -depth -delete
          fi

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - changes
      - rust
      - dashboard
      - electron-alpha
      - hermes-bridge
      - nix-checks
      - nix-service-packages
      - devfinity-smoke
      - brain-product-matrix
    runs-on: depot-ubuntu-24.04
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUN_RUST: ${{ needs.changes.outputs.run_rust }}
      RESULT_RUST: ${{ needs.rust.result }}
      RUN_DASHBOARD: ${{ needs.changes.outputs.run_dashboard }}
      RESULT_DASHBOARD: ${{ needs.dashboard.result }}
      RUN_ELECTRON_ALPHA: ${{ needs.changes.outputs.run_electron_alpha }}
      RESULT_ELECTRON_ALPHA: ${{ needs['electron-alpha'].result }}
      RUN_HERMES_BRIDGE: ${{ needs.changes.outputs.run_hermes_bridge }}
      RESULT_HERMES_BRIDGE: ${{ needs['hermes-bridge'].result }}
      RUN_NIX_CHECKS: ${{ needs.changes.outputs.run_nix_checks }}
      RESULT_NIX_CHECKS: ${{ needs['nix-checks'].result }}
      RUN_NIX_SERVICE_PACKAGES: ${{ needs.changes.outputs.run_nix_service_packages }}
      RESULT_NIX_SERVICE_PACKAGES: ${{ needs['nix-service-packages'].result }}
      RUN_DEVFINITY_SMOKE: ${{ needs.changes.outputs.run_devfinity_smoke }}
      RESULT_DEVFINITY_SMOKE: ${{ needs['devfinity-smoke'].result }}
      RUN_BRAIN_PRODUCT_MATRIX: ${{ needs.changes.outputs.run_brain_product_matrix }}
      RESULT_BRAIN_PRODUCT_MATRIX: ${{ needs['brain-product-matrix'].result }}
    steps:
      - name: Require selected harnesses
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "Change detection finished with: $CHANGES_RESULT" >&2
            exit 1
          fi

          failed=false

          check_selected() {
            local name=$1
            local selected=$2
            local result=$3

            case "$selected" in
              true)
                if [[ "$result" != success ]]; then
                  echo "$name was selected but finished with: $result" >&2
                  failed=true
                fi
                ;;
              false)
                ;;
              *)
                echo "$name has an invalid selection value: $selected" >&2
                failed=true
                ;;
            esac
          }

          check_selected "Rust workspace" "$RUN_RUST" "$RESULT_RUST"
          check_selected "Dashboard" "$RUN_DASHBOARD" "$RESULT_DASHBOARD"
          check_selected "Electron alpha" "$RUN_ELECTRON_ALPHA" "$RESULT_ELECTRON_ALPHA"
          check_selected "Hermes bridge" "$RUN_HERMES_BRIDGE" "$RESULT_HERMES_BRIDGE"
          check_selected "Nix checks" "$RUN_NIX_CHECKS" "$RESULT_NIX_CHECKS"
          check_selected "Nix service packages" "$RUN_NIX_SERVICE_PACKAGES" "$RESULT_NIX_SERVICE_PACKAGES"
          check_selected "devfinity smoke" "$RUN_DEVFINITY_SMOKE" "$RESULT_DEVFINITY_SMOKE"
          check_selected "Brain product matrix" "$RUN_BRAIN_PRODUCT_MATRIX" "$RESULT_BRAIN_PRODUCT_MATRIX"

          if [[ "$failed" == true ]]; then
            exit 1
          fi
