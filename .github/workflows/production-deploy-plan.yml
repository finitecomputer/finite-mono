name: Production Deploy Plan
on:
  pull_request:
    branches: [production]
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
env:
  CACHIX_CACHE_NAME: finite
jobs:
  plan:
    name: Plan production deploy
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Configure Cachix read-only cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true
      - name: Build deployment plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mkdir -p target/production-deploy
          python3 scripts/production_deploy.py plan \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output target/production-deploy/deployment-plan.json \
            --summary target/production-deploy/deployment-plan.md
      - name: Build lat1 closure artifact
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          scripts/build-lat1-nixos-closure-artifact \
            "$HEAD_SHA" \
            target/lat1-nixos-closure
      - name: Upload plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-plan-${{ github.event.pull_request.head.sha }}
          path: |
            target/production-deploy/deployment-plan.json
            target/production-deploy/deployment-plan.md
            target/lat1-nixos-closure/manifest.json
            target/lat1-nixos-closure/store-paths.txt
            target/lat1-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14
      - name: Comment deployment plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- finite-production-deploy-plan -->";
            const body = marker + "\n" + fs.readFileSync("target/production-deploy/deployment-plan.md", "utf8");
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Verify CI gate for source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          conclusion="$(
            gh run list \
              --workflow ci.yml \
              --commit "$HEAD_SHA" \
              --json conclusion,status \
              --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length'
          )"
          if [[ "$conclusion" == "0" ]]; then
            echo "CI gate has not completed successfully for $HEAD_SHA" >&2
            exit 1
          fi
