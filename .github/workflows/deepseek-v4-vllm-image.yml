name: DeepSeek V4 vLLM Image

run-name: Publish DeepSeek V4 vLLM ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable candidate version, for example 0.25.1-0731-reasoning.1"
        required: true
        type: string

concurrency:
  group: deepseek-v4-vllm-image-${{ inputs.version }}

jobs:
  publish:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: deepseek-v4-vllm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: depot/setup-action@v1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the source-pinned compatibility image
        id: build
        working-directory: deepseek-v4-vllm-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/deepseek-v4-vllm
          VERSION: ${{ inputs.version }}
          DEPOT_PROJECT_ID: ${{ vars.DEPOT_DEEPSEEK_VLLM_PROJECT_ID || vars.DEPOT_PROJECT_ID }}
          DEPOT_DISABLE_OTEL: "1"
        run: |
          version_ref="$IMAGE:$VERSION"
          sha_ref="$IMAGE:sha-${GITHUB_SHA::12}"
          if [ -z "$DEPOT_PROJECT_ID" ]; then
            echo "::error::set DEPOT_DEEPSEEK_VLLM_PROJECT_ID or DEPOT_PROJECT_ID repository variable"
            exit 1
          fi
          depot build \
            --platform linux/amd64 \
            --build-arg "FINITE_MONO_REV=$GITHUB_SHA" \
            --file infra/images/deepseek-v4-vllm.Dockerfile \
            --tag "$version_ref" \
            --tag "$sha_ref" \
            --metadata-file image-metadata.json \
            --push \
            .
          digest="$(jq -r '."containerimage.digest"' image-metadata.json)"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::depot build did not return an image digest"
            cat image-metadata.json
            exit 1
          fi
          echo "pinned=$version_ref@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify the published image contract
        env:
          PINNED: ${{ steps.build.outputs.pinned }}
        run: |
          docker pull "$PINNED"
          test "$(docker image inspect "$PINNED" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$PINNED" --format '{{index .Config.Labels "ai.finite.vllm.upstream-fix"}}')" = "77434861904a9f01ea4818fe9f0c7b2a5c05686e"
          test "$(docker image inspect "$PINNED" --format '{{index .Config.Labels "ai.finite.vllm.rust-frontend-fix"}}')" = "77434861904a9f01ea4818fe9f0c7b2a5c05686e"
          docker run --rm --entrypoint python3 "$PINNED" \
            -c 'import importlib.metadata; assert importlib.metadata.version("vllm") == "0.25.1"'
          docker run --rm --entrypoint python3 "$PINNED" \
            /usr/local/libexec/patch_vllm_deepseek_v4_0731.py check
          docker run --rm --entrypoint python3 "$PINNED" -c \
            'import pathlib, vllm; b=(pathlib.Path(vllm.__path__[0])/"vllm-rs").read_bytes(); assert b"Beyond maximum" in b and b"Absolute maximum" in b'

      - name: Summarize
        env:
          PINNED: ${{ steps.build.outputs.pinned }}
        run: |
          echo "DeepSeek V4 0731 vLLM candidate:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$PINNED\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Base: vLLM 0.25.1; Python and Rust reasoning backport: 77434861904a9f01ea4818fe9f0c7b2a5c05686e" >> "$GITHUB_STEP_SUMMARY"
