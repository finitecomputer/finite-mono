name: DeepSeek V4 vLLM Image
run-name: Build DeepSeek V4 vLLM ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable candidate version, for example 0.25.1-0731-reasoning.1"
        required: true
        type: string
      publish_production:
        description: Promote the verified saved build to production version tags
        required: true
        default: false
        type: boolean
concurrency:
  group: deepseek-v4-vllm-image-${{ inputs.version }}
jobs:
  publish:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: deepseek-v4-vllm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: depot/setup-action@v1
        with:
          oidc: true
      - name: Reject production promotion until its cutover gate is open
        if: inputs.publish_production == true && vars.FINITE_GHCR_PRODUCTION_PUBLISH_ENABLED != 'true'
        run: |
          echo "::error::FINITE_GHCR_PRODUCTION_PUBLISH_ENABLED is not true"
          exit 1
      - name: Log in to GHCR for canary publication
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - name: Build and save the source-pinned compatibility image
        id: build
        uses: depot/build-push-action@v1
        with:
          project: ${{ vars.DEPOT_DEEPSEEK_VLLM_PROJECT_ID || secrets.DEPOT_DEEPSEEK_VLLM_PROJECT_ID || vars.DEPOT_PROJECT_ID || secrets.DEPOT_PROJECT_ID }}
          context: deepseek-v4-vllm-${{ github.run_id }}-${{ github.run_attempt }}
          file: deepseek-v4-vllm-${{ github.run_id }}-${{ github.run_attempt }}/infra/images/deepseek-v4-vllm.Dockerfile
          platforms: linux/amd64
          build-args: FINITE_MONO_REV=${{ github.sha }}
          provenance: true
          save: true
      - name: Publish and verify the non-production canary
        id: canary
        working-directory: deepseek-v4-vllm-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          SOURCE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/finitecomputer/deepseek-v4-vllm
          DEPOT_PROJECT_ID: ${{ steps.build.outputs.project-id }}
        run: |
          canary_ref="$IMAGE:canary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -n "$BUILD_ID"
          test -n "$SOURCE_DIGEST"
          depot push --project "$DEPOT_PROJECT_ID" --tag "$canary_ref" "$BUILD_ID"
          docker pull "$canary_ref" >/dev/null
          destination_digest="$(
            docker image inspect "$canary_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | sed -n "s#^$IMAGE@##p" \
              | head -n 1
          )"
          python3 scripts/delivery.py verify-image-promotion \
            --source-digest "$SOURCE_DIGEST" \
            --destination-digest "$destination_digest"
          docker buildx imagetools inspect --raw "$IMAGE@$destination_digest" > image-index.json
          python3 scripts/delivery.py verify-image-index \
            --manifest image-index.json \
            --platform linux/amd64 \
            --require-attestation
          echo "digest=$destination_digest" >> "$GITHUB_OUTPUT"
          echo "pinned=$IMAGE@$destination_digest" >> "$GITHUB_OUTPUT"
      - name: Verify the canary contract
        working-directory: deepseek-v4-vllm-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          PINNED: ${{ steps.canary.outputs.pinned }}
        run: |
          test "$(docker image inspect "$PINNED" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$PINNED" --format '{{index .Config.Labels "ai.finite.vllm.upstream-fix"}}')" = "77434861904a9f01ea4818fe9f0c7b2a5c05686e"
          test "$(docker image inspect "$PINNED" --format '{{index .Config.Labels "ai.finite.vllm.rust-frontend-fix"}}')" = "77434861904a9f01ea4818fe9f0c7b2a5c05686e"
          docker run --rm --entrypoint python3 "$PINNED" \
            -c 'import importlib.metadata; assert importlib.metadata.version("vllm") == "0.25.1"'
          docker run --rm --entrypoint python3 "$PINNED" \
            /usr/local/libexec/patch_vllm_deepseek_v4_0731.py check
          docker run --rm --entrypoint python3 "$PINNED" -c \
            'import pathlib, vllm; b=(pathlib.Path(vllm.__path__[0])/"vllm-rs").read_bytes(); assert b"Beyond maximum" in b and b"Absolute maximum" in b'
      - name: Prove anonymous GHCR pull
        env:
          PINNED: ${{ steps.canary.outputs.pinned }}
        run: |
          docker logout ghcr.io
          docker image rm "$PINNED" >/dev/null 2>&1 || true
          docker pull "$PINNED" >/dev/null
      - name: Promote the same saved build to production tags
        id: production
        if: inputs.publish_production == true && vars.FINITE_GHCR_PRODUCTION_PUBLISH_ENABLED == 'true'
        working-directory: deepseek-v4-vllm-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          SOURCE_DIGEST: ${{ steps.canary.outputs.digest }}
          IMAGE: ghcr.io/finitecomputer/deepseek-v4-vllm
          VERSION: ${{ inputs.version }}
          DEPOT_PROJECT_ID: ${{ steps.build.outputs.project-id }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          version_ref="$IMAGE:$VERSION"
          sha_ref="$IMAGE:sha-${GITHUB_SHA::12}"
          depot push --project "$DEPOT_PROJECT_ID" --tag "$version_ref" --tag "$sha_ref" "$BUILD_ID"
          for ref in "$version_ref" "$sha_ref"; do
            docker pull "$ref" >/dev/null
            digest="$(docker image inspect "$ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' | sed -n "s#^$IMAGE@##p" | head -n 1)"
            python3 scripts/delivery.py verify-image-promotion --source-digest "$SOURCE_DIGEST" --destination-digest "$digest"
          done
          echo "pinned=$version_ref@$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Summarize
        env:
          CANARY: ${{ steps.canary.outputs.pinned }}
          PRODUCTION: ${{ steps.production.outputs.pinned }}
        run: |
          echo "Verified anonymous canary: \`$CANARY\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PRODUCTION" ]; then
            echo "Production promotion: \`$PRODUCTION\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production promotion remained disabled." >> "$GITHUB_STEP_SUMMARY"
