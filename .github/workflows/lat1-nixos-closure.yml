name: Lat1 NixOS Closure

on:
  workflow_dispatch:
    inputs:
      rev:
        description: "Exact finite-mono commit to build"
        required: true
        type: string
      runs_on_json:
        description: "GitHub runner label JSON string or labels array"
        required: true
        default: '"depot-ubuntu-24.04"'
        type: string
      include_file_cache:
        description: "Include legacy nix-cache/ in the artifact for explicit bootstrap/recovery"
        required: false
        default: false
        type: boolean

concurrency:
  group: lat1-nixos-closure-${{ inputs.rev }}

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: finite

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs_on_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}
          fetch-depth: 1

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Configure Cachix read-only cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build and package closure
        env:
          REV: ${{ inputs.rev }}
          FINITE_LAT1_BUILD_FILE_CACHE: ${{ inputs.include_file_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REV"
          scripts/build-lat1-nixos-closure-artifact \
            "$REV" \
            target/lat1-nixos-closure

      - name: Publish lat1 closure to Cachix
        if: ${{ ! inputs.include_file_cache }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CACHIX_AUTH_TOKEN:-}" ]]; then
            echo "::error::set CACHIX_AUTH_TOKEN for this GitHub Actions workflow"
            exit 1
          fi
          scripts/publish-lat1-nixos-cachix-closure target/lat1-nixos-closure

      - name: Upload closure artifact
        if: ${{ ! inputs.include_file_cache }}
        uses: actions/upload-artifact@v4
        with:
          name: lat1-nixos-closure-${{ inputs.rev }}
          path: |
            target/lat1-nixos-closure/manifest.json
            target/lat1-nixos-closure/store-paths.txt
            target/lat1-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload closure artifact with file cache
        if: ${{ inputs.include_file_cache }}
        uses: actions/upload-artifact@v4
        with:
          name: lat1-nixos-closure-${{ inputs.rev }}
          path: |
            target/lat1-nixos-closure/manifest.json
            target/lat1-nixos-closure/store-paths.txt
            target/lat1-nixos-closure/closure-size.txt
            target/lat1-nixos-closure/nix-cache
          if-no-files-found: error
          retention-days: 14
