name: Open Production Deploy PR
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  open:
    name: Open main to production PR
    runs-on: ubuntu-latest
    steps:
      - name: Create or report production deploy PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          production_sha="$(gh api "repos/$REPO/git/ref/heads/production" --jq .object.sha)"

          echo "main=$main_sha"
          echo "production=$production_sha"

          if [[ "$main_sha" == "$production_sha" ]]; then
            echo "production already points at main; no deploy PR needed."
            exit 0
          fi

          existing="$(
            gh pr list \
              --repo "$REPO" \
              --base production \
              --head main \
              --state open \
              --json url \
              --jq '.[0].url // ""'
          )"
          if [[ -n "$existing" ]]; then
            echo "Production deploy PR already exists: $existing"
            exit 0
          fi

          body="$(mktemp)"
          cat > "$body" <<EOF
          Promote current \`main\` to the protected \`production\` branch.

          - main: \`$main_sha\`
          - production before: \`$production_sha\`

          This PR is the review surface for a Production Deploy. The deploy workflow still follows \`infra/deployments/production.toml\`; if \`mutation_enabled = false\`, merging only records validation evidence.

          If GitHub shows an "Approve workflows" banner, approve it so the required \`Plan production deploy\` check can run. The PR was opened by GitHub Actions using \`GITHUB_TOKEN\`.
          EOF

          gh pr create \
            --repo "$REPO" \
            --base production \
            --head main \
            --title "Deploy main to production" \
            --body-file "$body"
