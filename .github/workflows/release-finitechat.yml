name: Release finitechat CLI
on:
  push:
    tags: ["finitechat/v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all build rows pass
        required: true
        default: false
        type: boolean
      alias_only:
        description: Repoint the rolling alias from existing versioned assets without rebuilding
        required: true
        default: false
        type: boolean
      release_tag:
        description: Historical component tag for alias-only promotion; leave blank for a normal release
        required: false
        default: ""
concurrency:
  group: release-finitechat
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.alias_only != true
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      # This delivery contract currently publishes Linux CLI assets only.
      # Restore Darwin/Electron rows with a dedicated macOS release lane.
      matrix:
        include:
          - asset_name: finitechat-linux-x86_64
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Validate component version
        run: |
          case "$GITHUB_REF_NAME" in
            finitechat/v*) version="${GITHUB_REF_NAME#finitechat/v}" ;;
            *) echo "::error::release workflow must run at a finitechat/v* tag"; exit 1 ;;
          esac
          python3 scripts/delivery.py verify-component-version --component finitechat --version "$version"
      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add "${{ matrix.target }}"
      - name: Build finitechat CLI
        run: cargo build --locked --release --target "${{ matrix.target }}" --package finitechat-cli --bin finitechat
      - name: Package finitechat CLI
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/finitechat" dist/finitechat
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist -czf "$ASSET_NAME.tar.gz" finitechat
          sha256sum "$ASSET_NAME.tar.gz" > "$ASSET_NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256
          if-no-files-found: error
  publish:
    needs: build
    if: vars.FINITE_RELEASE_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.alias_only != true))
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish immutable version and rolling alias
        env:
          GH_TOKEN: ${{ secrets.FINITE_RELEASES_GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#finitechat/v}"
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/delivery.py publish-release \
            --component finitechat \
            --version "$version" \
            --source-sha "$source_sha" \
            --run-id "$GITHUB_RUN_ID" \
            --assets-dir release-assets \
            --repository finitecomputer/finite-releases
  promote-alias:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.alias_only == true && vars.FINITE_RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repoint rolling alias from verified immutable assets
        env:
          GH_TOKEN: ${{ secrets.FINITE_RELEASES_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            finitechat/v*) version="${RELEASE_TAG#finitechat/v}" ;;
            *) echo "::error::release_tag must be a finitechat/v* tag"; exit 1 ;;
          esac
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          source_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          python3 scripts/delivery.py promote-release-alias \
            --component finitechat \
            --version "$version" \
            --expected-source-sha "$source_sha" \
            --repository finitecomputer/finite-releases
