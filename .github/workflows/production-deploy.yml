name: Production validation
on:
  push:
    branches: [production]
  workflow_dispatch:
concurrency:
  group: production-validation
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
jobs:
  validate:
    name: Validate production without mutation
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'production' || github.sha }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Resolve source and comparison commits
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == push && "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base_sha="$PUSH_BEFORE"
          else
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          python3 scripts/production_deploy.py ci-source \
            --source "$source_sha" \
            --push-before "$base_sha" \
            --github-output "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Build and guard deployment plan
        run: |
          set -euo pipefail
          mkdir -p target/production-deploy
          python3 scripts/production_deploy.py plan \
            --base "${{ steps.inputs.outputs.base_sha }}" \
            --head "${{ steps.inputs.outputs.source_sha }}" \
            --output target/production-deploy/deployment-plan.json \
            --summary target/production-deploy/deployment-plan.md
          python3 scripts/delivery.py require-production-disabled \
            --manifest target/production-deploy/deployment-plan.json
      - name: Verify CI gate for source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
          CI_SOURCE_SHA: ${{ steps.inputs.outputs.ci_source_sha }}
          CI_SOURCE_REASON: ${{ steps.inputs.outputs.ci_source_reason }}
        run: |
          set -euo pipefail
          echo "Production source SHA: $SOURCE_SHA"
          echo "CI source SHA: $CI_SOURCE_SHA ($CI_SOURCE_REASON)"
          conclusion="$(
            gh run list \
              --workflow ci.yml \
              --commit "$CI_SOURCE_SHA" \
              --json conclusion,status \
              --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length'
          )"
          if [[ "$conclusion" == "0" ]]; then
            echo "CI gate has not completed successfully for $CI_SOURCE_SHA" >&2
            exit 1
          fi
      - name: Build lat1 closure artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.inputs.outputs.source_sha }}"
          scripts/build-lat1-nixos-closure-artifact \
            "${{ steps.inputs.outputs.source_sha }}" \
            target/lat1-nixos-closure
      - name: Record the closed mutation boundary
        run: |
          set -euo pipefail
          python3 scripts/production_deploy.py record \
            --plan target/production-deploy/deployment-plan.json \
            --output target/production-deploy/deployment-record.json \
            --outcome dry_run_blocked_before_mutation
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-${{ steps.inputs.outputs.source_sha }}
          path: |
            target/production-deploy/deployment-plan.json
            target/production-deploy/deployment-plan.md
            target/production-deploy/deployment-record.json
            target/lat1-nixos-closure/manifest.json
            target/lat1-nixos-closure/nix-cache
            target/lat1-nixos-closure/store-paths.txt
            target/lat1-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14
