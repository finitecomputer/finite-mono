name: Production Deploy
on:
  push:
    branches: [production]
  workflow_dispatch:
concurrency:
  group: production-lat1
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  deployments: write
jobs:
  prepare:
    name: Prepare production deploy
    runs-on: depot-ubuntu-24.04
    outputs:
      mutation_enabled: ${{ steps.manifest.outputs.mutation_enabled }}
      source_sha: ${{ steps.inputs.outputs.source_sha }}
      base_sha: ${{ steps.inputs.outputs.base_sha }}
      ci_source_sha: ${{ steps.inputs.outputs.ci_source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'production' || github.sha }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Resolve source and comparison commits
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          ci_push_before=""
          if [[ "$EVENT_NAME" == push && "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base_sha="$PUSH_BEFORE"
            ci_push_before="$base_sha"
          else
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            git fetch origin main --prune
            if ! git merge-base --is-ancestor "$source_sha" origin/main; then
              ci_push_before="$base_sha"
            fi
          fi
          python3 scripts/production_deploy.py ci-source \
            --source "$source_sha" \
            --push-before "$ci_push_before" \
            --github-output "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Build deployment plan
        run: |
          set -euo pipefail
          mkdir -p target/production-deploy
          python3 scripts/production_deploy.py plan \
            --base "${{ steps.inputs.outputs.base_sha }}" \
            --head "${{ steps.inputs.outputs.source_sha }}" \
            --output target/production-deploy/deployment-plan.json \
            --summary target/production-deploy/deployment-plan.md
      - name: Read mutation flag
        id: manifest
        run: |
          set -euo pipefail
          mutation_enabled="$(python3 -c 'import json; print(str(json.load(open("target/production-deploy/deployment-plan.json"))["mutation_enabled"]).lower())')"
          echo "mutation_enabled=$mutation_enabled" >> "$GITHUB_OUTPUT"
      - name: Verify CI gate for source SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
          CI_SOURCE_SHA: ${{ steps.inputs.outputs.ci_source_sha }}
          CI_SOURCE_REASON: ${{ steps.inputs.outputs.ci_source_reason }}
        run: |
          set -euo pipefail
          echo "Production source SHA: $SOURCE_SHA"
          echo "CI source SHA: $CI_SOURCE_SHA ($CI_SOURCE_REASON)"
          conclusion="$(
            gh run list \
              --workflow ci.yml \
              --commit "$CI_SOURCE_SHA" \
              --json conclusion,status \
              --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length'
          )"
          if [[ "$conclusion" == "0" ]]; then
            echo "CI gate has not completed successfully for $CI_SOURCE_SHA" >&2
            exit 1
          fi
      - name: Build lat1 closure artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.inputs.outputs.source_sha }}"
          scripts/build-lat1-nixos-closure-artifact \
            "${{ steps.inputs.outputs.source_sha }}" \
            target/lat1-nixos-closure
      - name: Upload deployment plan
        uses: actions/upload-artifact@v4
        with:
          name: deployment-plan
          path: |
            target/production-deploy/deployment-plan.json
            target/production-deploy/deployment-plan.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload lat1 closure artifact
        uses: actions/upload-artifact@v4
        with:
          name: lat1-nixos-closure-${{ steps.inputs.outputs.source_sha }}
          path: |
            target/lat1-nixos-closure/manifest.json
            target/lat1-nixos-closure/nix-cache
            target/lat1-nixos-closure/store-paths.txt
            target/lat1-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14
      - name: Record the closed mutation boundary
        if: steps.manifest.outputs.mutation_enabled == 'false'
        run: |
          set -euo pipefail
          python3 scripts/production_deploy.py record \
            --plan target/production-deploy/deployment-plan.json \
            --output target/production-deploy/deployment-record.json \
            --outcome dry_run_blocked_before_mutation
      - name: Upload dry-run deployment record
        if: steps.manifest.outputs.mutation_enabled == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record
          path: target/production-deploy/deployment-record.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    needs: prepare
    if: needs.prepare.outputs.mutation_enabled == 'true'
    runs-on: depot-ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Download deployment plan
        uses: actions/download-artifact@v4
        with:
          name: deployment-plan
          path: target/production-deploy
      - name: Download reviewed closure artifact
        id: closure-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lat1-nixos-closure-${{ needs.prepare.outputs.source_sha }}
          path: target/lat1-nixos-closure
      - name: Validate or rebuild lat1 closure artifact
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! -f target/lat1-nixos-closure/manifest.json ]]; then
            echo "Reviewed closure artifact was unavailable; rebuilding exact source SHA."
            rm -rf target/lat1-nixos-closure
            scripts/build-lat1-nixos-closure-artifact \
              "$SOURCE_SHA" \
              target/lat1-nixos-closure
          fi
          python3 -m json.tool target/lat1-nixos-closure/manifest.json >/dev/null
          test "$(
            python3 -c 'import json; print(json.load(open("target/lat1-nixos-closure/manifest.json"))["rev"])'
          )" = "$SOURCE_SHA"
      - name: Configure production SSH
        env:
          FINITE_PRODUCTION_SSH_KEY: ${{ secrets.FINITE_PRODUCTION_SSH_KEY }}
          FINITE_PRODUCTION_KNOWN_HOSTS: ${{ secrets.FINITE_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$FINITE_PRODUCTION_SSH_KEY"
          test -n "$FINITE_PRODUCTION_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$FINITE_PRODUCTION_SSH_KEY" > ~/.ssh/finite-production
          chmod 0600 ~/.ssh/finite-production
          printf '%s\n' "$FINITE_PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host finite-production-lat1
            HostName 64.34.82.77
            User root
            IdentityFile ~/.ssh/finite-production
            IdentitiesOnly yes
            BatchMode yes
          EOF
      - name: Stage status collector on lat1
        id: status
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          remote_dir="/root/finite-status-$SOURCE_SHA-$GITHUB_RUN_ID"
          ssh -T finite-production-lat1 "install -d -m 0700 '$remote_dir'"
          scp scripts/finite-status scripts/finite_status.py \
            "finite-production-lat1:$remote_dir/"
          ssh -T finite-production-lat1 \
            "chmod 0500 '$remote_dir/finite-status' '$remote_dir/finite_status.py'"
          echo "remote_dir=$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Capture finite-status before
        env:
          REMOTE_STATUS_DIR: ${{ steps.status.outputs.remote_dir }}
        run: |
          set -euo pipefail
          mkdir -p target/production-deploy
          set +e
          ssh -T finite-production-lat1 \
            "cd '$REMOTE_STATUS_DIR' && ./finite-status --json" \
            > target/production-deploy/finite-status-before.json
          status_rc=$?
          set -e
          test -s target/production-deploy/finite-status-before.json
          python3 -m json.tool target/production-deploy/finite-status-before.json >/dev/null
          exit "$status_rc"
      - name: Cross Mutation Boundary and deploy lat1
        run: |
          set -euo pipefail
          mkdir -p target/production-deploy
          date -u '+%Y-%m-%dT%H:%M:%SZ' \
            > target/production-deploy/mutation-boundary-crossed
          FINITE_LAT1_TARGET=finite-production-lat1 \
            scripts/deploy-lat1-closure-cache target/lat1-nixos-closure
      - name: Capture finite-status after
        if: always()
        env:
          REMOTE_STATUS_DIR: ${{ steps.status.outputs.remote_dir }}
        run: |
          set -euo pipefail
          mkdir -p target/production-deploy
          set +e
          ssh -T finite-production-lat1 \
            "cd '$REMOTE_STATUS_DIR' && ./finite-status --json" \
            > target/production-deploy/finite-status-after.json
          status_rc=$?
          set -e
          test -s target/production-deploy/finite-status-after.json
          python3 -m json.tool target/production-deploy/finite-status-after.json >/dev/null
          exit "$status_rc"
      - name: Write deployment record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/production-deploy
          if [[ ! -f target/production-deploy/deployment-plan.json ]]; then
            python3 scripts/production_deploy.py plan \
              --base "${{ needs.prepare.outputs.base_sha }}" \
              --head "${{ needs.prepare.outputs.source_sha }}" \
              --output target/production-deploy/deployment-plan.json
          fi
          record_args=()
          if [[ -f target/production-deploy/mutation-boundary-crossed ]]; then
            record_args+=(--mutation-boundary-crossed)
          fi
          if [[ -f target/lat1-nixos-closure/manifest.json ]]; then
            system_path="$(python3 -c 'import json; print(json.load(open("target/lat1-nixos-closure/manifest.json"))["system"])')"
            record_args+=(--system-path "$system_path")
          fi
          python3 scripts/production_deploy.py record \
            --plan target/production-deploy/deployment-plan.json \
            --output target/production-deploy/deployment-record.json \
            --outcome "${{ job.status }}" \
            "${record_args[@]}"
      - name: Upload finite-status before
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-status-before
          path: target/production-deploy/finite-status-before.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload finite-status after
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-status-after
          path: target/production-deploy/finite-status-after.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload deployment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record
          path: target/production-deploy/deployment-record.json
          if-no-files-found: error
          retention-days: 14
