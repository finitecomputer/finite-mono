name: Lat4 NixOS Closure

on:
  workflow_dispatch:
    inputs:
      rev:
        description: "Exact finite-mono commit on main to build"
        required: true
        type: string
      runs_on_json:
        description: "GitHub runner label JSON string or labels array"
        required: true
        default: '"depot-ubuntu-24.04"'
        type: string

concurrency:
  group: lat4-nixos-closure-${{ inputs.rev }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs_on_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}
          fetch-depth: 1

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Build and package finite-lat-4 closure
        env:
          REV: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REV"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$REV" origin/main
          scripts/build-lat4-nixos-closure-artifact \
            "$REV" \
            target/lat4-nixos-closure

      - name: Upload closure artifact
        uses: actions/upload-artifact@v4
        with:
          name: lat4-nixos-closure-${{ inputs.rev }}
          path: |
            target/lat4-nixos-closure/manifest.json
            target/lat4-nixos-closure/nix-cache
            target/lat4-nixos-closure/store-paths.txt
            target/lat4-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14
