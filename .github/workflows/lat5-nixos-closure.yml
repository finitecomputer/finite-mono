name: Lat5 NixOS Closure

on:
  pull_request:
    paths:
      - 'infra/nixos/hosts/finite-lat-5/**'
      - 'infra/nixos/tests/lat5-storage-boot.nix'
      - 'scripts/*lat5*'
      - 'scripts/tests/test_lat5*.py'
      - '.github/workflows/lat5-nixos-closure.yml'
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:
    inputs:
      rev:
        description: "Exact finite-mono commit on main to build"
        required: true
        type: string
      runs_on_json:
        description: "GitHub runner label JSON string or labels array"
        required: true
        default: '"ubuntu-24.04"'
        type: string

concurrency:
  group: lat5-nixos-closure-${{ inputs.rev || github.ref }}

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: finite
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}

jobs:
  qualify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require hardware virtualization for storage qualification
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true
      - name: Validate installer and bootstrap boundaries
        run: python3 -m unittest scripts.tests.test_lat5_closure_artifact scripts.tests.test_lat5_bootstrap
      - name: Qualify storage and both EFI boot paths on synthetic disks
        run: nix build --option builders '' --print-build-logs .#checks.x86_64-linux.lat5-storage-boot
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(inputs.runs_on_json) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}
          fetch-depth: 0

      - name: Require hardware virtualization for storage qualification
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Configure Cachix read-only cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build and package finite-lat-5 closure
        env:
          REV: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REV"
          git fetch origin main
          git merge-base --is-ancestor "$REV" origin/main
          scripts/build-lat5-nixos-closure-artifact \
            "$REV" \
            target/lat5-nixos-closure

      - name: Upload closure artifact
        uses: actions/upload-artifact@v4
        with:
          name: lat5-nixos-closure-${{ inputs.rev }}
          path: |
            target/lat5-nixos-closure/manifest.json
            target/lat5-nixos-closure/nix-cache
            target/lat5-nixos-closure/store-paths.txt
            target/lat5-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14
