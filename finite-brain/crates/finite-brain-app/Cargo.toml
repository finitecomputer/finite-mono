[package]
name = "finite-brain-app"
default-run = "finite-brain"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Binary entrypoint for the FiniteBrain application server."

[[bin]]
name = "finite-brain"
path = "src/main.rs"

[[bin]]
name = "finite-brain-labels"
path = "src/labels.rs"

[dependencies]
axum = { version = "0.8.7", features = ["tokio", "http1"] }
finite-brain-server = { path = "../finite-brain-server" }
finite-nostr.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio-postgres = "0.7"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
finite-brain-core = { path = "../finite-brain-core" }
finite-brain-store = { path = "../finite-brain-store" }
sha2.workspace = true

[lints]
workspace = true
