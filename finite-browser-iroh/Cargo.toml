[package]
name = "finite-browser-iroh"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
# Match the CLI supplied by the pinned Nix browser-iroh shell.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
serde_json = "1"
console_error_panic_hook = "0.1"
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.2", features = ["js"] }
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
