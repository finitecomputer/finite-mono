# Compatibility matrix: what finite-mono cannot see from one checkout.
#
# Inside the monorepo, same-commit compatibility is automatic. This file
# exists for the artifacts already OUT THERE — released binaries installed on
# user machines and hosted agents running older runtime images — so a change
# that would strand them is a deliberate, reviewed act (edit this file in the
# same PR) instead of an accident.
#
# Maintained by hand at release time. Each release checklist in
# infra/runbooks/ includes "update compat/matrix.toml".

[field.finitechat-cli]
# Released CLI versions believed installed in the field (hosted agents use
# releases/latest at install time).
released = ["v0.1.0", "v0.1.1", "v0.1.2", "v0.1.3", "v0.1.4", "v0.1.5"]
install_url = "https://github.com/finitecomputer/finite-mono/releases/download/finitechat-latest/"
notes = "Hard-cut 2026-07-08: installers point at the finite-mono rolling alias. The pre-cut releases listed above were installed from the legacy repo URL; no live users depend on it. v0.1.4 adds the signed and notarized Apple Silicon Electron client; v0.1.5 adds bounded microphone recording through the existing attachment path. Both preserve the CLI/server protocol. Server must keep accepting these clients until a deprecation is announced."

[field.finitechat-electron]
released = ["v0.1.4", "v0.1.5", "v0.1.6", "v0.1.7", "v0.1.8"]
install_url = "https://github.com/finitecomputer/finite-mono/releases/download/finitechat-latest/finitechat-electron-macos-aarch64.zip"
notes = "Developer ID-signed and Apple-notarized direct-download app for Apple Silicon. Electron is a distinct revocable Device on the user's existing Finite Chat account. v0.1.5 activates bounded microphone recording through the existing attachment path; v0.1.6 moves Electron onto the deployed WorkOS dashboard surface; v0.1.7 fixes packaged Brain assets and local-daemon startup presentation; v0.1.8 makes the persisted device id part of the local MLS generation, rotating it with rebuilt cryptographic state while preserving normal same-generation retries. v0.1.6 and v0.1.7 were internal rollout steps with no external user cohort; the rolling alias points at v0.1.8."

[field.fsite-cli]
released = ["v0.3.1", "v0.4.0"]
install_url = "https://github.com/finitecomputer/finite-mono/releases/download/fsite-latest/"
notes = "v0.4.0 is the first mono-cut release (also ships finitesitesd-linux for the server deploy)."

[field.fbrain-cli]
released = ["v0.1.2", "v0.1.3"]
install_url = "https://github.com/finitecomputer/finite-mono/releases/download/fbrain-latest/"
notes = "v0.1.3 hard-cuts durable CLI unlock state, scopes raw Folder Keys to operations, enforces private Brain Working Tree control paths, and adds Product Client Session Lock. The release also ships the finite-brain server binary for the smoke bridge."

[field.agent-runtime-image]
# Hosted agents pinned at launch time; they do NOT auto-update.
image = "ghcr.io/finitecomputer/agent-runtime"
deployed = ["2026-07-10.2", "2026-07-10.3", "2026-07-10.4", "2026-07-10.5", "2026-07-10.6", "2026-07-11.2", "2026-07-11.3", "2026-07-11.4", "2026-07-11.6", "2026-07-14.1", "2026-07-14.2", "2026-07-14.3", "2026-07-15.1", "2026-07-15.2", "2026-07-15.3", "2026-07-15.4", "2026-07-15.5", "2026-07-16.1", "2026-07-16.2", "2026-07-21.1", "2026-07-22.1", "2026-07-24.1"]
digest = "sha256:87ca23a5ee004a6691bd8df950109e220e71e4e24fadb3b75e716b25ba68c0b5"
source_commit = "76f9b5c8f584b4dc1a4a74bdcd53e2f16d13dbea"
