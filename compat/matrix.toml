# Compatibility matrix: what finite-mono cannot see from one checkout.
#
# Inside the monorepo, same-commit compatibility is automatic. This file
# exists for the artifacts already OUT THERE — released binaries installed on
# user machines and hosted agents running older runtime images — so a change
# that would strand them is a deliberate, reviewed act (edit this file in the
# same PR) instead of an accident.
#
# Maintained by hand at release time. Each release checklist in
# infra/runbooks/ includes "update compat/matrix.toml".

[field.finitechat-cli]
# Released CLI versions believed installed in the field (hosted agents use
# releases/latest at install time).
released = ["v0.1.0", "v0.1.1", "v0.1.2", "v0.1.3", "v0.1.4", "v0.1.5"]
install_url = "https://github.com/finitecomputer/finite-mono/releases/download/finitechat-latest/"
notes = "Hard-cut 2026-07-08: installers point at the finite-mono rolling alias. The pre-cut releases listed above were installed from the legacy repo URL; no live users depend on it. v0.1.4 adds the signed and notarized Apple Silicon Electron client; v0.1.5 adds bounded microphone recording through the existing attachment path. Both preserve the CLI/server protocol. Server must keep accepting these clients until a deprecation is announced."

[field.finitechat-electron]
released = ["v0.1.4", "v0.1.5"]
install_url = "https://github.com/finitecomputer/finite-mono/releases/download/finitechat-latest/finitechat-electron-macos-aarch64.zip"
notes = "Developer ID-signed and Apple-notarized direct-download app for Apple Silicon. Electron is a distinct revocable Device on the user's existing Finite Chat account; v0.1.4 includes revoked-device recovery and v0.1.5 activates bounded microphone recording through the existing attachment path."

[field.fsite-cli]
released = ["v0.3.1", "v0.4.0", "v0.5.0"]
install_url = "https://github.com/finitecomputer/finite-mono/releases/download/fsite-latest/"
notes = "v0.5.0 adds typed mailbox/NIP-05/npub targets and the mailbox-principal reconciliation and persistent-sharing flows; the release also ships finitesitesd-linux for the server deploy."

[field.fbrain-cli]
released = ["v0.1.2", "v0.1.3", "v0.2.0", "v0.2.1", "v0.2.2", "v0.3.0", "v0.4.0"]
install_url = "https://github.com/finitecomputer/finite-mono/releases/download/fbrain-latest/"
notes = "v0.2.1 keeps new non-Markdown asset bytes out of Folder Objects, syncs Markdown Asset Source Notes under raw/, preserves legacy inline Asset ciphertext as unsupported, and retains incremental-write compatibility with older servers through a bounded-bootstrap fallback. It also adds email-invitation delivery reporting, a non-rewriting V21 migration that permits parallel Brain and Folder invitations, and an opt-in disposable-stack rate-limit override; production defaults are unchanged. Product Client readable-asset portability remains deferred. The release also ships the finite-brain server binary. v0.2.2 shipped the daemon-supervise inotify feedback-loop fix (PR #481). v0.3.0 is the ADR-0046 release: principal grants with provenance, the blessed member/admin invite CLI with signed approval artifacts (fbrain approvals list/approve/deny), chat approval cards anchored to messages via metadata.approve, cohort Folder invitations via folder-scoped plans, the restore drill, SQLite WAL with point lookups and denormalized capacity counters, and backon-owned retry timing. Server binary ships in lockstep at 0.3.0. v0.4.0 fixes llm-wiki papercuts (duplicate member 400, account-email resolution, supervise ticks; PR #581) and adds courtesy email plus a self-describing deliveryStatus for account-backed invitations (PR #587). Server binary ships in lockstep at 0.4.0."

[field.agent-runtime-image]
# Hosted agents pinned at launch time; they do NOT auto-update.
image = "ghcr.io/finitecomputer/agent-runtime"
deployed = ["2026-07-10.2", "2026-07-10.3", "2026-07-10.4", "2026-07-10.5", "2026-07-10.6", "2026-07-11.2", "2026-07-11.3", "2026-07-11.4", "2026-07-11.6", "2026-07-14.1", "2026-07-14.2", "2026-07-14.3", "2026-07-15.1", "2026-07-15.2", "2026-07-15.3", "2026-07-15.4", "2026-07-15.5", "2026-07-16.1", "2026-07-16.2", "2026-07-21.1", "2026-07-22.1", "2026-08-05.1", "2026-08-07.1", "2026-08-07.2", "2026-08-11.1", "2026-08-18.1", "2026-08-20.1"]
digest = "sha256:63f2df2b6d447a6c6f364ed795885b5cec278c776b3fc19574a655446e6bf8c0"
source_commit = "0758088b8a8c78ef69fd72110ead0444336b2b2d"
hermes = "0.20.0"
notes = "Kata launches the immutable digest through a promoted Core artifact. Existing agents can be rolled serially through Core's guarded same-volume upgrade path while preserving their Agent Principal and durable /data mount. 2026-08-05.1 was the lat3 convergence target; 2026-08-07.1 brought hermes 0.20.0 (GitHub-tarball channel) and fbrain 0.2.1; 2026-08-07.2 restored the manifest-driven plugin data files the 0.20 wheel build drops (PR #460). 2026-08-11.1 ships fbrain 0.2.2 (PR #481: daemon-supervise inotify feedback-loop fix — the fleet-wide ~1.3 cores/VM burn since the Aug 7 roll) and is the 2026-08-11 fleet-roll target for lat1+lat3. 2026-08-18.1 ships the finitechat single-writer store lease with read-only one-shot CLI paths (PR #572), the agentd bridge-ready deadline 30s→180s (PR #571; root cause of the 2026-08-18 boot loop on history-heavy rooms), and durable-smoke observability plus a finite-private-keyed model smoke (PR #570); the durable smoke passed with principal/room continuity across restart. Rolled 2026-08-19 to the full lat1+lat3 fleet (51 agents upgraded and verified); the only non-target records are the known drift set (Sites Canary 0715, Sol 2). 2026-08-20.1 normalizes the legacy glm-5-2 model name to deepseek-v4-flash-0731 at the Hermes launcher boundary (PR #585) and makes the Hermes adapter durable across restarts: reply routes persist in an adapter-owned SQLite (no more replies landing in home-chat after a restart) and inbox events ack only after the turn completes with persisted dedup (PRs #589/#591, issues #588/#574). Rolled 2026-08-20 to the full fleet via clean --roll-all on both hosts (lat3 29/29, lat1 22/22); the Sites Canary 0715 drift record was retired properly the same day via runtime-offboard-retired-exact (PR #586), leaving Smoke Studio as the only known non-target record."

