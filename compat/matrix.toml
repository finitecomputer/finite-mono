notes = "Kata launches the immutable digest through a promoted Core artifact. Existing agents move only through Core's guarded same-volume upgrade path. 2026-07-24.1 passed the build-once durable restart smoke, is promoted for new Kata launches, and contains the current fbrain 0.1.3 command surface from the recorded source commit. Upgrade Canary 0715 was explicitly upgraded from 2026-07-21.1 to this exact digest while preserving its Agent Principal and writable durable /data mount. Other existing runtimes remain on their recorded images until explicitly upgraded."

