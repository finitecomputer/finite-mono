apiVersion: v1
kind: Namespace
metadata:
  name: fc-identity-edge
---
# This selectorless service targets the canonical Authority edge on lat2.
# It lets the legacy finite.vip apex serve the standard NIP-05 path while all
# other apex requests redirect to finite.computer. The wildcard stays on the
# legacy fleet and is not matched by either route below.
apiVersion: v1
kind: Service
metadata:
  name: finite-identity-authority
  namespace: fc-identity-edge
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: finite-identity-authority
  namespace: fc-identity-edge
subsets:
  - addresses:
      - ip: 64.34.80.19
    ports:
      - name: https
        port: 443
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: finite-identity-authority
  namespace: fc-identity-edge
spec:
  serverName: identity.finite.vip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: finite-identity-authority-host
  namespace: fc-identity-edge
spec:
  headers:
    customRequestHeaders:
      Host: identity.finite.vip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: finite-vip-apex-redirect
  namespace: fc-identity-edge
spec:
  redirectRegex:
    regex: '^https://finite\.vip(.*)'
    replacement: 'https://finite.computer${1}'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: finite-identity-nip05
  namespace: fc-identity-edge
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`finite.vip`) && Path(`/.well-known/nostr.json`)
      priority: 10000
      middlewares:
        - name: finite-identity-authority-host
      services:
        - name: finite-identity-authority
          port: 443
          scheme: https
          serversTransport: finite-identity-authority
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: finite-vip-apex-redirect
  namespace: fc-identity-edge
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`finite.vip`)
      # The exact NIP-05 route above must win before this apex catch-all.
      priority: 1
      middlewares:
        - name: finite-vip-apex-redirect
      services:
        # Traefik evaluates the redirect before proxying. Reusing the bounded
        # public Authority backend avoids adding a dummy workload solely to
        # satisfy the IngressRoute service schema.
        - name: finite-identity-authority
          port: 443
          scheme: https
          serversTransport: finite-identity-authority
  tls:
    certResolver: letsencrypt
