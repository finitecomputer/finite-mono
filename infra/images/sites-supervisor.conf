[unix_http_server]
file=/run/sites-supervisor.sock
chmod=0600
chown=0:0

[supervisord]
nodaemon=true
user=0
umask=0077
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/sites-supervisor.pid
childlogdir=/run

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/sites-supervisor.sock

; Stop in reverse priority order: cron, backup (including restart cleanup), Sites.
[program:sites]
command=/usr/bin/python3 /usr/local/bin/sites-supervisor.py exec-sites /run/sites-argv.json
priority=100
autostart=true
autorestart=true
startsecs=1
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sites-backup]
command=/usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root TZ=UTC /usr/local/bin/sites-backup run --config /run/sites-backup.json
priority=200
autostart=false
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=/usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root TZ=UTC /usr/sbin/cron -f
priority=300
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
