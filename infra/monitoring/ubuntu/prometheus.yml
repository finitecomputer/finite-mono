global:
  scrape_interval: 5m
  scrape_timeout: 3s
  evaluation_interval: 1m

scrape_configs:
  - job_name: finite.computer
    metrics_path: /probe
    params:
      module: [http_200]
    static_configs:
      - targets: [https://finite.computer]
        labels:
          probe: finite-monitoring
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
    metric_relabel_configs: &probe_metrics
      - source_labels: [__name__]
        regex: probe_success|probe_duration_seconds|probe_http_status_code
        action: keep

  - job_name: chat.finite.computer
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [chat_ready]
    static_configs:
      - targets: [https://chat.finite.computer/readyz]
        labels:
          probe: finite-monitoring
    relabel_configs: *blackbox_relabel
    metric_relabel_configs: *probe_metrics

  - job_name: brain.finite.computer
    metrics_path: /probe
    params:
      module: [http_200]
    static_configs:
      - targets: [https://brain.finite.computer/health]
        labels:
          probe: finite-monitoring
    relabel_configs: *blackbox_relabel
    metric_relabel_configs: *probe_metrics

  - job_name: finite.site
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [http_200]
    static_configs:
      - targets: [https://finite.site/api/v2/healthz]
        labels:
          probe: finite-monitoring
    relabel_configs: *blackbox_relabel
    metric_relabel_configs: *probe_metrics

  # An unallocated site must reach Sites through wildcard DNS/TLS and return 404.
  - job_name: uptime-probe.finite.site
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [http_404]
    static_configs:
      - targets: [https://uptime-probe.finite.site/]
        labels:
          probe: finite-monitoring
    relabel_configs: *blackbox_relabel
    metric_relabel_configs: *probe_metrics

  # Dedicated read-only token, provisioned before this scrape job is enabled.
  - job_name: finite-sites-metrics
    scrape_interval: 1m
    scrape_timeout: 3s
    scheme: https
    metrics_path: /internal/v1/metrics
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /etc/finite/monitoring/sites-metrics-token
    static_configs:
      - targets: [finite.site]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: finite_sites_existing|finite_sites_published|finite_sites_created_by_day|finite_sites_metrics_collected_at_seconds
        action: keep

  - job_name: finite-tinfoil-collector
    scrape_interval: 1m
    static_configs:
      - targets: [127.0.0.1:9100]
        labels:
          probe: finite-monitoring
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: finite_tinfoil_.*
        action: keep

  # Dedicated read-only limiter credential; never use an inference/accounting key.
  - job_name: finite-private-limiter
    scrape_interval: 15s
    scrape_timeout: 3s
    scheme: https
    metrics_path: /metrics
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /etc/finite/monitoring/private-limiter-metrics-token
    static_configs:
      - targets: [finite-private.finite.containers.tinfoil.dev]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: finite_private_limiter_(live|admission_mode|active_requests|requests_started_total|admissions_total|refusals_total|requests_total|route_requests_total|route_input_tokens_total|route_output_tokens_total|settlements_total|settlement_failures_total|diagnostic_persistence_failures_total|route_(request_duration|first_output|first_answer)_seconds_(bucket|count|sum))
        action: keep
