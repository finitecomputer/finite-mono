# CPU compatibility bridge for the historical generated hostname. Deploy this
# as external container `kimi-k2-6` immediately after the old eight-H200
# container has been replaced by `finite-private`. It carries no model weights
# or secrets. Caddy proxies the full route surface to the new container; a
# dedicated :8888 health endpoint lets the healthcheck prove caddy liveness
# without depending on upstream state.
cvm-version: 0.10.8
cpus: 2
memory: 2048

networks:
  fp-upstream:
    egress: allowlist
    allow:
      - finite-private.finite.containers.tinfoil.dev

containers:
  - name: "finite-private-compatibility-bridge"
    image: "caddy:2.10.2-alpine@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83"
    restart: always
    command: ["sh", "-c", "printf \":8000 {\\n  reverse_proxy https://finite-private.finite.containers.tinfoil.dev {\\n    header_up Host {upstream_hostport}\\n  }\\n}\\n:8888 {\\n  respond \\\"ok\\\" 200\\n}\\n\" > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile"]
    networks: [fp-upstream]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/"]
      interval: 30s
      timeout: 5s
      start_period: 30s

shim:
  upstream-container: finite-private-compatibility-bridge
  upstream-port: 8000
  authenticated: false
  # Preserve the upstream service's complete route surface. Caddy and this
  # shim do not keep a second endpoint allowlist.
  paths:
    - "/*"
