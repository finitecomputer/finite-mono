# Evidence-backed Inkling Small candidate. This file is intentionally not
# release-ready: modelwrap must emit the pinned model MPK and CI must publish a
# reviewed Finite image containing the checked-in launcher and router.
cvm-version: 0.10.8
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "inkling-small-nvfp4"
    repo: "thinkingmachines/Inkling-Small-NVFP4@b6a99534467840620d411e4cd4ad5819b2610d9c"
    mpk: "REPLACE_WITH_INKLING_SMALL_NVFP4_MPK"

networks:
  model-net: {}
  core-api:
    egress: allowlist
    allow:
      - finite.computer

containers:
  - name: "inkling-small"
    image: "REPLACE_WITH_DIGEST_PINNED_FINITE_INKLING_VLLM_IMAGE"
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - INKLING_MODEL_PATH: "/tinfoil/mpk/mpk-REPLACE_WITH_INKLING_SMALL_ROOT"
      - INKLING_REPLICA_COUNT: "4"
      - INKLING_GPU_MEMORY_UTILIZATION: "0.80"
      - INKLING_MAX_ACTIVE_PER_REPLICA: "256"
    tmpfs:
      /tmp: size=4g,mode=1777,exec
      /root: size=20g,mode=0700,exec
    networks: [model-net]
    secrets:
      - VLLM_API_KEY
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 45m

  - name: "finite-private-limiter"
    image: "ghcr.io/finitecomputer/private-limiter@sha256:5d57ecf462fcb105eae2160dd01493efd825532fb61ee286098bdc1b485ec84b"
    restart: always
    env:
      - LISTEN_ADDR: "0.0.0.0:8002"
      - FINITE_USAGE_API_URL: "https://finite.computer"
      - UPSTREAM_BASE_URL: "http://inkling-small:8000"
      - FINITE_PRIVATE_MODEL: "glm-5-2"
      - DASHBOARD_URL: "https://finite.computer/dashboard"
      - READINESS_TIMEOUT_SECS: "5"
      - FINITE_USAGE_API_TIMEOUT_SECS: "15"
      - UPSTREAM_FIRST_BYTE_TIMEOUT_SECS: "240"
      - UPSTREAM_BODY_TIMEOUT_SECS: "1200"
      - UPSTREAM_STREAM_IDLE_TIMEOUT_SECS: "1200"
    secrets:
      - FINITE_USAGE_API_SERVICE_KEY
      - VLLM_INTERNAL_API_KEY
    networks: [model-net, core-api]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/live"]
      interval: 30s
      timeout: 5s
      start_period: 45m

shim:
  upstream-container: finite-private-limiter
  upstream-port: 8002
  authenticated: false
  paths:
    - /v1/chat/completions
    - /v1/responses
    - /metrics
    - /live
    - /health
    - /ready
