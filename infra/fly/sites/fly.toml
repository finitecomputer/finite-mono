# Cutover target: apply only after the gates in infra/runbooks/deploy-sites.md.
# This deployment consumes an existing CI-built image; Fly does not build it.
app = "finite-sites"
primary_region = "iad"
kill_signal = "SIGINT"
# Covers ordered cron -> backup worker -> Sites shutdown when backups are enabled.
kill_timeout = 120

[build]
  # d3245b403d938d5fde9bdd36a4a6a2f879086ef2; restore rehearsal passed.
  # Pending invalid Git events still block correcting pushes; replace after the fix.
  # https://github.com/finitecomputer/finite-mono/actions/runs/35049949459
  image = "ghcr.io/finitecomputer/finite-sites@sha256:e951abcb5ab5e4b0f48e316af4ec5a260eee2d2e37dd4419edf998716502c722"

[deploy]
  strategy = "rolling"

[processes]
  app = "serve --data /var/lib/finite-sites --listen [::]:8787 --base-domain finite.site --api-url https://finite.site --git-url https://finite.site --site-scheme https --site-port none --git-auto-reconcile true --mailer resend --mail-from 'Finite Sites <links@finite.chat>'"

[env]
  # Qualify the dashboard /site-auth route and upstream before applying this file.
  FINITE_SITES_ACCOUNT_LOGIN_URL = "https://finite.computer/site-auth"
  # Enable only with the dedicated repository, file secrets and remote restore proof.
  FINITE_SITES_BACKUP_ENABLED = "0"

[mounts]
  source = "sites_data"
  destination = "/var/lib/finite-sites"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v2/healthz"
    [http_service.checks.headers]
      Host = "finite.site"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
