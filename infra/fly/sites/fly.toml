# Production Sites service; deployment and recovery: infra/runbooks/deploy-sites.md.
# This deployment consumes an existing CI-built image; Fly does not build it.
# This is the real production server for finite.site. "demo" is only the
# historical Fly app name; retaining it preserves the volume, IPs and certificates.
app = "finite-sites-demo"
primary_region = "iad"
kill_signal = "SIGINT"
# Covers ordered cron -> backup worker -> Sites shutdown when backups are enabled.
kill_timeout = 120

[build]
  # 50fe66794bc9b626e0ebd350f149a6f75e774055; authenticated usage metrics + backup/restore qualified.
  # https://github.com/finitecomputer/finite-mono/actions/runs/35282731405
  image = "ghcr.io/finitecomputer/finite-sites@sha256:416fad616a26ddc43707ef3871541d584cb77b64f51c8f72bc1e315bb0406b41"

[deploy]
  strategy = "rolling"

[processes]
  app = "serve --data /var/lib/finite-sites --listen [::]:8787 --base-domain finite.site --api-url https://finite.site --git-url https://finite.site --site-scheme https --site-port none --git-auto-reconcile true --mailer resend --mail-from 'Finite Sites <links@finite.chat>'"

[env]
  FINITE_SITES_ACCOUNT_LOGIN_URL = "https://finite.computer/site-auth"
  FINITE_SITES_BACKUP_ENABLED = "1"
  FINITE_SITES_BACKUP_REPOSITORY = "fm2890@fm2890.rsync.net:finitecomputer/finite-sites"
  FINITE_SITES_BACKUP_REMOTE_PATH = "borg12"

[[files]]
  guest_path = "/var/lib/finitecomputer/backups/rsync-net/id_ed25519"
  secret_name = "FINITE_SITES_BORG_SSH_KEY"

[[files]]
  guest_path = "/var/lib/finitecomputer/backups/rsync-net/known_hosts"
  secret_name = "FINITE_SITES_BORG_KNOWN_HOSTS"

[[files]]
  guest_path = "/var/lib/finitecomputer/backups/rsync-net/borg-passphrase"
  secret_name = "FINITE_SITES_BORG_PASSPHRASE"

[mounts]
  source = "sites_data"
  destination = "/var/lib/finite-sites"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v2/healthz"
    [http_service.checks.headers]
      Host = "finite.site"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
