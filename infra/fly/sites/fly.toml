# Option B / Fly: isolated demo in the Finite organization.
# No build definition: this deployment consumes an existing CI-built image.
app = "finite-sites-demo"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 30

[deploy]
  strategy = "rolling"

[processes]
  app = "serve --data /var/lib/finite-sites --listen 0.0.0.0:8787 --base-domain finite.site --api-url https://finite.site --git-url https://finite.site --site-scheme https --site-port none --mailer dev"

[mounts]
  source = "sites_data"
  destination = "/var/lib/finite-sites"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v2/healthz"
    [http_service.checks.headers]
      Host = "finite.site"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
