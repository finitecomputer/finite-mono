<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    >
    <meta name="color-scheme" content="light dark">
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        user-select: none;
      }

      nav {
        position: absolute;
        top: 8px;
        left: 0;
        display: flex;
        gap: 2px;
        height: 28px;
        padding: 2px;
        border: 1px solid color-mix(in srgb, CanvasText 13%, transparent);
        border-radius: 9px;
        background: color-mix(in srgb, Canvas 78%, transparent);
        box-shadow: 0 1px 4px color-mix(in srgb, CanvasText 9%, transparent);
        -webkit-app-region: no-drag;
        backdrop-filter: blur(18px) saturate(1.35);
      }

      a {
        display: grid;
        width: 24px;
        height: 22px;
        place-items: center;
        border-radius: 6px;
        color: CanvasText;
        text-decoration: none;
      }

      a:hover:not([aria-disabled="true"]) {
        background: color-mix(in srgb, CanvasText 10%, transparent);
      }

      a:active:not([aria-disabled="true"]) {
        background: color-mix(in srgb, CanvasText 16%, transparent);
      }

      a:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: -1px;
      }

      a[aria-disabled="true"] {
        opacity: 0.28;
        pointer-events: none;
      }

      svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Page history">
      <a
        id="back"
        href="finitechat-navigation://back"
        aria-label="Go back"
        aria-disabled="true"
        title="Back"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M10.5 3 5.5 8l5 5"></path>
        </svg>
      </a>
      <a
        id="forward"
        href="finitechat-navigation://forward"
        aria-label="Go forward"
        aria-disabled="true"
        title="Forward"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="m5.5 3 5 5-5 5"></path>
        </svg>
      </a>
    </nav>
    <script>
      "use strict";
      globalThis.setNavigationState = ({ canGoBack, canGoForward }) => {
        document.querySelector("#back").setAttribute("aria-disabled", String(!canGoBack));
        document.querySelector("#forward").setAttribute("aria-disabled", String(!canGoForward));
      };
    </script>
  </body>
</html>
