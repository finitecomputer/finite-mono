name: Production Deploy Plan
on:
  pull_request:
    branches: [production]
env:
  CACHIX_CACHE_NAME: finite
  # Depot CI sandboxes do not populate USER; Cachix needs the runner account.
  USER: runner
jobs:
  plan:
    name: Plan production deploy
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Configure Cachix read-only cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true
      - name: Build and guard deployment plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mkdir -p target/production-deploy
          python3 scripts/production_deploy.py plan \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output target/production-deploy/deployment-plan.json \
            --summary target/production-deploy/deployment-plan.md
          python3 scripts/delivery.py require-production-disabled \
            --manifest target/production-deploy/deployment-plan.json
      - name: Build lat1 closure artifact
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/build-lat1-nixos-closure-artifact \
            "$HEAD_SHA" \
            target/lat1-nixos-closure
      - name: Upload plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-plan-${{ github.event.pull_request.head.sha }}
          path: |
            target/production-deploy/deployment-plan.json
            target/production-deploy/deployment-plan.md
            target/lat1-nixos-closure/manifest.json
            target/lat1-nixos-closure/nix-cache
            target/lat1-nixos-closure/store-paths.txt
            target/lat1-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14
