name: Service Images
run-name: Build ${{ inputs.image }} ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      rev:
        description: Exact reviewed commit on Origin main to build
        required: true
        type: string
      image:
        description: Which image to build
        required: true
        type: choice
        options:
          - core
          - dashboard
          - private-limiter
          - specialization-worker
      version:
        description: Image version tag, for example 2026-07-08.1
        required: true
        type: string
      publish_production:
        description: Promote the verified saved build to production version tags
        required: true
        default: false
        type: boolean
concurrency:
  group: service-image-${{ inputs.image }}-${{ inputs.version }}
env:
  SOURCE_REV: ${{ inputs.rev }}
jobs:
  publish:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}
          fetch-depth: 0
      - name: Verify exact source revision
        run: |
          [[ "$SOURCE_REV" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REV"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_REV" origin/main
      - uses: depot/setup-action@v1
        with:
          oidc: true
      - name: Reject production promotion until its cutover gate is open
        if: inputs.publish_production == true && vars.FINITE_GHCR_PRODUCTION_PUBLISH_ENABLED != 'true'
        run: |
          echo "::error::FINITE_GHCR_PRODUCTION_PUBLISH_ENABLED is not true"
          exit 1
      - name: Resolve image parameters
        id: params
        run: |
          case "${{ inputs.image }}" in
            core)
              echo "name=finite-saas-core" >> "$GITHUB_OUTPUT"
              echo "dockerfile=infra/images/core.Dockerfile" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
            dashboard)
              echo "name=finite-saas-dashboard" >> "$GITHUB_OUTPUT"
              echo "dockerfile=infra/images/dashboard.Dockerfile" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
            private-limiter)
              echo "name=private-limiter" >> "$GITHUB_OUTPUT"
              echo "dockerfile=infra/images/private-limiter.Dockerfile" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "build_args=FINITE_MONO_REV=$SOURCE_REV" >> "$GITHUB_OUTPUT"
              ;;
            specialization-worker)
              echo "name=finite-specialization-worker" >> "$GITHUB_OUTPUT"
              echo "dockerfile=infra/images/specialization-worker.Dockerfile" >> "$GITHUB_OUTPUT"
              echo "context=." >> "$GITHUB_OUTPUT"
              echo "build_args=" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Log in to GHCR for canary publication
        env:
          GHCR_TOKEN: ${{ secrets.FINITE_GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.FINITE_GHCR_USERNAME }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - name: Build and save
        id: build
        uses: depot/build-push-action@v1
        with:
          project: ${{ vars.DEPOT_SERVICE_IMAGES_PROJECT_ID || secrets.DEPOT_SERVICE_IMAGES_PROJECT_ID || vars.DEPOT_PROJECT_ID || secrets.DEPOT_PROJECT_ID }}
          context: ${{ steps.params.outputs.context }}
          file: ${{ steps.params.outputs.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ steps.params.outputs.build_args }}
          provenance: true
          save: true
      - name: Publish and verify the non-production canary
        id: canary
        env:
          IMAGE: ghcr.io/finitecomputer/${{ steps.params.outputs.name }}
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          SOURCE_DIGEST: ${{ steps.build.outputs.digest }}
          DEPOT_PROJECT_ID: ${{ steps.build.outputs.project-id }}
        run: |
          canary_ref="$IMAGE:canary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -n "$BUILD_ID"
          test -n "$SOURCE_DIGEST"
          depot push --project "$DEPOT_PROJECT_ID" --tag "$canary_ref" "$BUILD_ID"
          docker pull "$canary_ref" >/dev/null
          destination_digest="$(
            docker image inspect "$canary_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              | sed -n "s#^$IMAGE@##p" \
              | head -n 1
          )"
          python3 scripts/delivery.py verify-image-promotion \
            --source-digest "$SOURCE_DIGEST" \
            --destination-digest "$destination_digest"
          docker buildx imagetools inspect --raw "$IMAGE@$destination_digest" > image-index.json
          python3 scripts/delivery.py verify-image-index \
            --manifest image-index.json \
            --platform linux/amd64 \
            --require-attestation
          if [ "${{ inputs.image }}" = "private-limiter" ]; then
            test "$(docker image inspect "$IMAGE@$destination_digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_REV"
          fi
          echo "digest=$destination_digest" >> "$GITHUB_OUTPUT"
          echo "pinned=$IMAGE@$destination_digest" >> "$GITHUB_OUTPUT"
      - name: Prove anonymous GHCR pull
        env:
          PINNED: ${{ steps.canary.outputs.pinned }}
        run: |
          docker logout ghcr.io
          docker image rm "$PINNED" >/dev/null 2>&1 || true
          docker pull "$PINNED" >/dev/null
      - name: Promote the same saved build to production tags
        id: production
        if: inputs.publish_production == true && vars.FINITE_GHCR_PRODUCTION_PUBLISH_ENABLED == 'true'
        env:
          IMAGE: ghcr.io/finitecomputer/${{ steps.params.outputs.name }}
          VERSION: ${{ inputs.version }}
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          SOURCE_DIGEST: ${{ steps.canary.outputs.digest }}
          DEPOT_PROJECT_ID: ${{ steps.build.outputs.project-id }}
          GHCR_TOKEN: ${{ secrets.FINITE_GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.FINITE_GHCR_USERNAME }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          version_ref="$IMAGE:$VERSION"
          sha_ref="$IMAGE:sha-${SOURCE_REV::12}"
          depot push --project "$DEPOT_PROJECT_ID" --tag "$version_ref" --tag "$sha_ref" "$BUILD_ID"
          for ref in "$version_ref" "$sha_ref"; do
            docker pull "$ref" >/dev/null
            digest="$(docker image inspect "$ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' | sed -n "s#^$IMAGE@##p" | head -n 1)"
            python3 scripts/delivery.py verify-image-promotion --source-digest "$SOURCE_DIGEST" --destination-digest "$digest"
          done
          echo "pinned=$version_ref@$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Summarize
        env:
          CANARY: ${{ steps.canary.outputs.pinned }}
          PRODUCTION: ${{ steps.production.outputs.pinned }}
        run: |
          echo "Verified anonymous canary: \`$CANARY\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PRODUCTION" ]; then
            echo "Production promotion: \`$PRODUCTION\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production promotion remained disabled." >> "$GITHUB_STEP_SUMMARY"
