name: Lat1 NixOS Closure
on:
  workflow_dispatch:
    inputs:
      rev:
        description: "Exact finite-mono commit to build"
        required: true
        type: string
concurrency:
  group: lat1-nixos-closure-${{ inputs.rev }}
permissions:
  contents: read
env:
  CACHIX_CACHE_NAME: finite
  # Depot CI sandboxes do not populate USER; Cachix needs the runner account.
  USER: runner
jobs:
  build:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Configure Cachix read-only cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          skipPush: true
      - name: Build and package closure
        env:
          REV: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REV"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REV" origin/main
          scripts/build-lat1-nixos-closure-artifact \
            "$REV" \
            target/lat1-nixos-closure
      - name: Upload closure artifact
        uses: actions/upload-artifact@v4
        with:
          name: lat1-nixos-closure-${{ inputs.rev }}
          path: |
            target/lat1-nixos-closure/manifest.json
            target/lat1-nixos-closure/nix-cache
            target/lat1-nixos-closure/store-paths.txt
            target/lat1-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14
