name: Lat3 NixOS Closure
on:
  workflow_dispatch:
    inputs:
      rev:
        description: "Exact finite-mono commit on main to build"
        required: true
        type: string
concurrency:
  group: lat3-nixos-closure-${{ inputs.rev }}
permissions:
  contents: read
jobs:
  build:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build and package finite-lat-3 closure
        env:
          REV: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REV"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REV" origin/main
          scripts/build-lat3-nixos-closure-artifact \
            "$REV" \
            target/lat3-nixos-closure
      - name: Upload closure artifact
        uses: actions/upload-artifact@v4
        with:
          name: lat3-nixos-closure-${{ inputs.rev }}
          path: |
            target/lat3-nixos-closure/manifest.json
            target/lat3-nixos-closure/nix-cache
            target/lat3-nixos-closure/store-paths.txt
            target/lat3-nixos-closure/closure-size.txt
          if-no-files-found: error
          retention-days: 14
